<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Help Desk - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );
        }

        .login-container {
            width: 92%;
            max-width: 420px;
        }

        .login-card {
            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);
        }

        .logo {
            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #1f2937;

            font-size: 26px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #374151;

            margin-bottom: 7px;

            font-size: 14px;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 2px solid #e5e7eb;

            border-radius: 10px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(
                    37,
                    99,
                    235,
                    0.1
                );
        }

        .login-button {
            width: 100%;

            border: none;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            padding: 13px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            margin-top: 5px;

            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(
                    37,
                    99,
                    235,
                    0.25
                );
        }

        .error-message {
            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 8px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            font-size: 13px;

            text-align: center;
        }

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #9ca3af;

            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🤖
        </div>

        <h1>
            AI Student Help Desk
        </h1>

        <div class="subtitle">
            Cloud-Based Multi-Agent AI Support System
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username / Email
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="role">
                    Login As
                </label>

                <select id="role">

                    <option value="student">
                        Student
                    </option>

                    <option value="faculty">
                        Faculty
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>


            <div
                id="errorMessage"
                class="error-message"
            >
                Invalid login details.
            </div>

        </form>


        <div class="footer">

            AI Student Help Desk

            <br>

            Powered by Multi-Agent AI + RAG

        </div>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value.trim();


            const role =
                document.getElementById(
                    "role"
                ).value;


            if (
                !username ||
                !password
            ) {

                errorMessage.innerText =
                    "Please enter username and password.";

                errorMessage.style.display =
                    "block";

                return;

            }


            /*
             * TEMPORARY LOGIN
             *
             * Abhi frontend testing ke liye.
             * Baad me database authentication
             * ke saath connect karenge.
             */

            localStorage.setItem(
                "studentHelpDeskUser",
                username
            );


            localStorage.setItem(
                "studentHelpDeskRole",
                role
            );


            /*
             * Existing AI Help Desk
             */

            if (role === "student") {

                window.location.href =
                    "index.html";

                return;

            }


            /*
             * Faculty/Admin ke dashboards
             * next step me banayenge.
             */

            if (role === "faculty") {

                alert(
                    "Faculty Dashboard will be connected next."
                );

                return;

            }


            if (role === "admin") {

                alert(
                    "Admin Dashboard will be connected next."
                );

                return;

            }

        }
    );

</script>

</body>
</html>
